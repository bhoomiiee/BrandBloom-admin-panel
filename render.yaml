# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # 1. Backend Web Service
  - type: web
    name: brandbloom-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AI_MODEL_VERSION
        value: brandbloom-optima-v2
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: CLIENT_URL
        fromService:
          type: web
          name: brandbloom-frontend
          property: host

  # 2. Frontend Static Site
  - type: web
    name: brandbloom-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: BrandBloom
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: brandbloom-backend
          property: url
          format: ${value}/api
