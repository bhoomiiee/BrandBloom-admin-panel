version: '3.8'

services:
  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandbloom-admin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - BRANDBLOOM_API_URL=http://host.docker.internal:3000/api

  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandbloom-admin-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - admin-backend
